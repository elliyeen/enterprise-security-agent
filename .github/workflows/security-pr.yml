name: Security toolkit validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify toolkit structure and security boundaries
        run: python3 scripts/validate_toolkit.py
      - name: Python syntax checks
        run: python3 -m py_compile scripts/validate_toolkit.py
